name: Build-and-Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-sdl3-linux:
    name: Build SDL3 for Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build SDL3 + SDL3_mixer (cached)
        uses: ./.github/actions/setup-sdl3-linux
        with:
          build-on-miss: 'true'

  build-shaders:
    needs: build-sdl3-linux
    name: Compile Shaders
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # shadercross links against SDL3
      - name: Setup SDL3 (cached)
        uses: ./.github/actions/setup-sdl3-linux

      - name: Setup shader toolchain
        uses: ./.github/actions/setup-shader-toolchain

      - name: Compile all shader formats
        run: make -f build/make/Makefile.shaders all

      - name: Verify every shader built for every backend
        run: |
          missing=0
          for n in line postfx primitive sprite_fx sprite_simple tri; do
            for s in vs ps; do
              for e in spv dxil msl; do
                f="res/shaders/compiled/${n}_${s}.${e}"
                [ -s "$f" ] || { echo "MISSING: $f"; missing=1; }
              done
            done
          done
          ls -la res/shaders/compiled/
          [ "$missing" = "0" ] || { echo "ERROR: shader set incomplete"; exit 1; }

      - name: Upload compiled shaders
        uses: actions/upload-artifact@v7
        with:
          name: compiled-shaders
          path: res/shaders/compiled/
          retention-days: 7
          overwrite: true

  build-linux:
    needs: build-sdl3-linux
    name: Build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup SDL3 (cached)
        uses: ./.github/actions/setup-sdl3-linux

      - name: Install LLVM toolchain
        uses: ./.github/actions/setup-llvm-toolchain
        with:
          llvm-version: "21"
          packages: clang-21
          create-alternatives: "true"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libpng-dev \
            libzip-dev \
            zlib1g-dev \
            libmimalloc-dev \
            libluajit-5.1-dev

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: astonia_net

      - name: Build
        run: make linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-build
          path: |
            bin/moac
            bin/libastonia_net.so
          retention-days: 30
          if-no-files-found: error

      - name: Upload Mod SDK (Linux headers)
        uses: actions/upload-artifact@v7
        with:
          name: mod-sdk-linux
          path: |
            src/amod/amod.h
            src/amod/amod_structs.h
            src/dll.h
            src/astonia.h
          retention-days: 30
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain (LLVM variant)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable-x86_64-pc-windows-gnullvm
          cache: true
          cache-workspaces: astonia_net

      - name: Setup MSYS2 (clang64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: clang64
          path-type: inherit
          update: true
          install: >
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-sdl3-mixer
            mingw-w64-clang-x86_64-sdl3-ttf
            mingw-w64-clang-x86_64-libpng
            mingw-w64-clang-x86_64-libzip
            mingw-w64-clang-x86_64-dwarfstack
            mingw-w64-clang-x86_64-mimalloc
            mingw-w64-clang-x86_64-luajit
            make
            git

      - name: Build
        run: make CC=clang windows

      - name: Copy DLL to bin
        run: cp astonia_net/target/x86_64-pc-windows-gnullvm/release/astonia_net.dll bin/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: |
            bin/moac.exe
            bin/astonia_net.dll
          retention-days: 30
          if-no-files-found: error

      - name: Upload Mod SDK (Windows)
        uses: actions/upload-artifact@v7
        with:
          name: mod-sdk-windows
          path: |
            lib/moac.a
            lib/moac.lib
            src/amod/amod.h
            src/amod/amod_structs.h
            src/dll.h
            src/astonia.h
          retention-days: 30
          if-no-files-found: error

  build-macos-arm:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install LLVM/Clang 21
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew uninstall --ignore-dependencies llvm@20 2>/dev/null || true
          brew install llvm@21
          echo "/opt/homebrew/opt/llvm@21/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          brew install sdl3 sdl3_mixer sdl3_ttf libzip zlib mimalloc imagemagick

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-darwin
          cache: true
          cache-workspaces: astonia_net

      - name: Build
        run: make macos

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm-build
          path: |
            bin/moac
            bin/libastonia_net.dylib
          retention-days: 30
          if-no-files-found: error

  build-docker-linux:
    name: Build Linux (Docker/Zig)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build with Docker (Zig)
        run: make docker-linux

      - name: Verify artifacts
        run: |
          test -f bin/moac
          test -f bin/libastonia_net.so
          file bin/moac

      - name: Upload Docker build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: docker-linux-build
          path: |
            bin/moac
            bin/libastonia_net.so
          retention-days: 30
          if-no-files-found: error

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-sdl3-linux]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup SDL3 (cached)
        uses: ./.github/actions/setup-sdl3-linux

      - name: Install LLVM toolchain
        uses: ./.github/actions/setup-llvm-toolchain
        with:
          llvm-version: "21"
          packages: clang-21
          create-alternatives: "true"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libpng-dev \
            libzip-dev \
            zlib1g-dev \
            libmimalloc-dev \
            libluajit-5.1-dev

      - name: Run tests
        run: make test

  # Format checking for C code only
  format-check:
    name: C Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install clang-format-21
        uses: ./.github/actions/setup-llvm-toolchain
        with:
          llvm-version: "21"
          packages: clang-format-21

      - name: Run C format check script
        run: scripts/check-format-c.sh

  # Static analysis for C code
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-sdl3-linux]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup SDL3 (cached)
        uses: ./.github/actions/setup-sdl3-linux

      - name: Install LLVM toolchain
        uses: ./.github/actions/setup-llvm-toolchain
        with:
          llvm-version: "21"
          packages: clang-21 clang-tidy-21 clang-format-21
          create-alternatives: "true"

      - name: Install additional dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bear \
            cppcheck \
            libpng-dev \
            libzip-dev \
            zlib1g-dev \
            libmimalloc-dev \
            libluajit-5.1-dev

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: astonia_net

      - name: Run static analysis script
        run: scripts/check-static-analysis.sh

      - name: Upload analysis reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: static-analysis-reports
          path: build/logs/*.log
          retention-days: 90

  # Rust formatting check
  rust-format-check:
    name: Rust Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          cache: true
          cache-workspaces: astonia_net

      - name: Run Rust format check script
        run: scripts/check-format-rust.sh

  # Rust linting (clippy)
  rust-lint-check:
    name: Rust Linting (clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
          cache: true
          cache-workspaces: astonia_net

      - name: Run Rust linting script
        run: scripts/check-clippy.sh

  # File consistency checks
  file-checks:
    name: File Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run file consistency script
        run: scripts/check-files.sh

  # Sanitizer build test
  sanitizer:
    name: AddressSanitizer/UBSan Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-sdl3-linux]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup SDL3 (cached)
        uses: ./.github/actions/setup-sdl3-linux

      - name: Install LLVM toolchain
        uses: ./.github/actions/setup-llvm-toolchain
        with:
          llvm-version: "21"
          packages: clang-21
          create-alternatives: "true"

      - name: Install additional dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpng-dev \
            libzip-dev \
            zlib1g-dev \
            libmimalloc-dev \
            libluajit-5.1-dev

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: astonia_net

      - name: Build with sanitizers
        run: make sanitizer
        env:
          CC: clang

      - name: Check sanitizer binary
        run: |
          echo "Sanitizer build successful!"
          ls -lh bin/moac-sanitizer
          file bin/moac-sanitizer

name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sdl3-linux:
    name: Build SDL3 for Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build SDL3 + SDL3_mixer (cached)
        uses: ./.github/actions/setup-sdl3-linux
        with:
          build-on-miss: 'true'

  build-linux-release:
    needs: [build-sdl3-linux]
    name: Build Linux Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup SDL3 (cached)
        uses: ./.github/actions/setup-sdl3-linux

      - name: Install LLVM toolchain
        uses: ./.github/actions/setup-llvm-toolchain
        with:
          llvm-version: "21"
          packages: clang-21
          create-alternatives: "true"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libpng-dev \
            libzip-dev \
            zlib1g-dev \
            libmimalloc-dev \
            libluajit-5.1-dev

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: astonia_net

      - name: Build release
        run: make linux

      - name: Strip debug symbols
        run: |
          strip bin/moac
          strip bin/libastonia_net.so

      - name: Prepare distribution staging
        run: make distrib-stage

      - name: Upload Binaries (Linux)
        uses: actions/upload-artifact@v7
        with:
          name: linux-binaries
          path: distrib/linux_client/bin/
          retention-days: 7
          overwrite: true

  build-windows-release:
    name: Build Windows Release
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Checkout LFS objects
        shell: bash
        run: git lfs pull

      - name: Install Rust toolchain (LLVM variant)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable-x86_64-pc-windows-gnullvm
          cache: true
          cache-workspaces: astonia_net

      - name: Setup MSYS2 (clang64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: clang64
          path-type: inherit
          update: true
          install: >
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-sdl3-mixer
            mingw-w64-clang-x86_64-libpng
            mingw-w64-clang-x86_64-libzip
            mingw-w64-clang-x86_64-dwarfstack
            mingw-w64-clang-x86_64-mimalloc
            mingw-w64-clang-x86_64-luajit
            make
            git

      - name: Build release
        run: make windows

      - name: Copy DLL to bin
        run: cp astonia_net/target/x86_64-pc-windows-gnullvm/release/astonia_net.dll bin/

      - name: Strip debug symbols
        run: |
          strip bin/moac.exe
          strip bin/astonia_net.dll

      - name: Prepare distribution staging
        run: make distrib-stage

      - name: Upload Binaries (Windows)
        uses: actions/upload-artifact@v7
        with:
          name: windows-binaries
          path: distrib/windows_client/bin/
          retention-days: 7
          overwrite: true

      - name: Upload Mod SDK (Windows)
        uses: actions/upload-artifact@v7
        with:
          name: mod-sdk-windows
          path: |
            lib/moac.a
            lib/moac.lib
            src/amod/amod.h
            src/amod/amod_structs.h
            src/dll.h
            src/astonia.h
          retention-days: 7
          if-no-files-found: error

  build-macos-release:
    name: Build MacOS Release
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check signing availability
        id: signing
        run: |
          if [ -n "$CERT" ]; then echo "available=true"; else echo "available=false"; fi >> $GITHUB_OUTPUT
        env:
          CERT: ${{ secrets.APPLE_CERT_P12 }}

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install dependencies
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install sdl3 sdl3_mixer libzip zlib mimalloc imagemagick

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-darwin
          cache: true
          cache-workspaces: astonia_net

      - name: Build release (moac + Rust lib)
        run: make macos

      - name: Strip debug symbols
        run: |
          strip bin/moac
          strip -x bin/libastonia_net.dylib

      - name: Collect Binaries (macOS)
        run: |
          mkdir -p binaries
          cp bin/moac binaries/
          cp bin/libastonia_net.dylib binaries/
          cp -L /opt/homebrew/lib/libSDL3.0.dylib binaries/ 2>/dev/null || true
          cp -L /opt/homebrew/lib/libSDL3_mixer.0.dylib binaries/ 2>/dev/null || true
          echo "=== macOS Binaries ==="
          ls -la binaries/

      - name: Upload Binaries (macOS)
        uses: actions/upload-artifact@v7
        with:
          name: macos-binaries
          path: binaries/
          retention-days: 7

      # ---- macOS signing + DMG (skipped when Apple secrets are not configured) ----
      - name: Build .app bundle
        if: steps.signing.outputs.available == 'true'
        run: make macos-appbundle

      - name: Install signing certificate
        if: steps.signing.outputs.available == 'true'
        run: |
          mkdir -p certs
          echo "${{ secrets.APPLE_CERT_P12 }}" | base64 --decode > certs/dist.p12

      - name: Install App Store Connect API key
        if: steps.signing.outputs.available == 'true'
        run: |
          mkdir -p private_keys
          echo '${{ secrets.APP_STORE_CONNECT_KEY }}' > "private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"

      - name: Install App Store Connect API key JSON
        if: steps.signing.outputs.available == 'true'
        run: |
          echo '${{ secrets.APP_STORE_CONNECT_KEY_JSON }}' > private_keys/appstore_key.json

      - name: Rename app to tmp name
        if: steps.signing.outputs.available == 'true'
        run: mv distrib/Astonia.app distrib/Astonia-unsigned.app

      - name: Sign Astonia.app
        if: steps.signing.outputs.available == 'true'
        uses: indygreg/apple-code-sign-action@v1
        with:
          input_path: distrib/Astonia-unsigned.app
          output_path: distrib/Astonia.app
          p12_file: certs/dist.p12
          p12_password: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
          notarize: false
          staple: false
          rcodesign_version: 0.29.0
          sign_args: |
            --binary-identifier
            com.prismaphonic.astonia
            --for-notarization

      - name: Remove unsigned app bundle
        if: steps.signing.outputs.available == 'true'
        run: rm -rf distrib/Astonia-unsigned.app

      - name: Create unsigned DMG from signed app
        if: steps.signing.outputs.available == 'true'
        run: |
          cd distrib
          hdiutil create \
            -volname "Astonia" \
            -srcfolder "Astonia.app" \
            -ov \
            -format UDZO \
            "Astonia-macOS-unsigned.dmg"
          cd ..
          ls -lh distrib/Astonia-macOS-unsigned.dmg

      - name: Sign, notarize, and staple DMG
        if: steps.signing.outputs.available == 'true'
        uses: indygreg/apple-code-sign-action@v1
        with:
          input_path: distrib/Astonia-macOS-unsigned.dmg
          output_path: distrib/Astonia-macOS.dmg
          p12_file: certs/dist.p12
          p12_password: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
          rcodesign_version: 0.29.0
          sign_args: |
            --for-notarization
          notarize: true
          staple: true
          app_store_connect_api_key_json_file: private_keys/appstore_key.json
          app_store_connect_api_issuer: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          app_store_connect_api_key: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}

      - name: Remove unsigned DMG
        if: steps.signing.outputs.available == 'true'
        run: rm -f distrib/Astonia-macOS-unsigned.dmg

      - name: Upload signed DMG
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: distrib/Astonia-macOS.dmg
          retention-days: 7
          if-no-files-found: error

  build-appimage-release:
    name: Build AppImage Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Build AppImage
        run: make appimage

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: appimage-release
          path: astonia-client.AppImage
          retention-days: 7

  create-release:
    name: Create GitHub Release
    needs:
      [
        build-linux-release,
        build-windows-release,
        build-macos-release,
        build-appimage-release,
      ]
    # macOS is not shipped yet: a failed macOS build must not block the Linux/Windows release
    if: >-
      ${{ !cancelled()
          && needs.build-linux-release.result == 'success'
          && needs.build-windows-release.result == 'success'
          && needs.build-appimage-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Download Linux Binaries
        uses: actions/download-artifact@v8
        with:
          name: linux-binaries
          path: linux_client/bin

      - name: Download Windows Binaries
        uses: actions/download-artifact@v8
        with:
          name: windows-binaries
          path: windows_client/bin

      - name: Download macOS DMG
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: macos-dmg
          path: .

      - name: Download AppImage
        uses: actions/download-artifact@v8
        with:
          name: appimage-release

      - name: Download Mod SDK (Windows)
        uses: actions/download-artifact@v8
        with:
          name: mod-sdk-windows
          path: mod-sdk

      - name: Download macOS Binaries
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: macos-binaries
          path: macos-binaries

      - name: Rename DMG to match convention
        if: hashFiles('Astonia-macOS.dmg') != ''
        run: mv Astonia-macOS.dmg client-macos.dmg

      - name: Rename AppImage to match convention
        run: mv astonia-client.AppImage client-linux.AppImage

      - name: Assemble full distributions
        run: |
          cp -r res linux_client/res
          cp -r res windows_client/res
          cp eula.txt license.txt linux_client/ 2>/dev/null || true
          cp eula.txt create_shortcut.bat windows_client/ 2>/dev/null || true

      - name: Create distribution archives
        run: |
          tar czf client-linux.tar.gz linux_client
          zip -q -r client-windows.zip windows_client
          zip -q -r mod-sdk.zip mod-sdk
          tar czf client-linux-binaries.tar.gz -C linux_client/bin .
          cd windows_client/bin && zip -q -r ../../client-windows-binaries.zip . && cd ../..
          if [ -d macos-binaries ] && [ -n "$(ls -A macos-binaries)" ]; then
            tar czf client-macos-binaries.tar.gz -C macos-binaries .
          else
            echo "No macOS binaries (build skipped/failed) - releasing Linux/Windows only"
          fi

      - name: Generate checksums
        run: |
          sha256sum client-linux.tar.gz > checksums.txt
          sha256sum client-windows.zip >> checksums.txt
          sha256sum client-linux.AppImage >> checksums.txt
          [ -f client-macos.dmg ] && sha256sum client-macos.dmg >> checksums.txt || true
          sha256sum mod-sdk.zip >> checksums.txt
          sha256sum client-linux-binaries.tar.gz >> checksums.txt
          sha256sum client-windows-binaries.zip >> checksums.txt
          [ -f client-macos-binaries.tar.gz ] && sha256sum client-macos-binaries.tar.gz >> checksums.txt || true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            client-linux.tar.gz
            client-windows.zip
            client-linux.AppImage
            client-macos.dmg
            mod-sdk.zip
            client-linux-binaries.tar.gz
            client-windows-binaries.zip
            client-macos-binaries.tar.gz
            checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

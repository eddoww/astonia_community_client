name: Release

on:
  push:
    tags:
      - '*'

jobs:
  build-linux-release:
    name: Build Linux Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        lfs: true

    - name: Checkout LFS objects
      run: git lfs pull

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          clang \
          libsdl2-dev \
          libsdl2-mixer-dev \
          libpng-dev \
          libzip-dev \
          zlib1g-dev

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        cache: true
        cache-workspaces: astonia_net

    - name: Build release
      run: make linux

    - name: Strip debug symbols
      run: |
        strip bin/moac
        strip bin/libastonia_net.so

    - name: Create distribution package
      run: make distrib

    - name: Upload distribution
      uses: actions/upload-artifact@v4
      with:
        name: linux-release
        path: linux_client.tar.gz
        retention-days: 90

  build-windows-release:
    name: Build Windows Release
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Checkout LFS objects
        shell: bash
        run: git lfs pull

      - name: Install Rust toolchain (GNU variant)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          cache: true
          cache-workspaces: astonia_net

      - name: Setup MSYS2 (clang64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: clang64
          path-type: inherit
          update: true
          install: >
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-SDL2
            mingw-w64-clang-x86_64-libpng
            mingw-w64-clang-x86_64-SDL2_mixer
            mingw-w64-clang-x86_64-libzip
            mingw-w64-clang-x86_64-dwarfstack
            make
            zip

      - name: Build release
        run: make windows

      - name: Copy DLL to bin
        run: cp astonia_net/target/x86_64-pc-windows-gnu/release/astonia_net.dll bin/

      - name: Strip debug symbols
        run: |
          strip bin/moac.exe
          strip bin/astonia_net.dll

      - name: Create distribution package
        run: make distrib

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: windows_client.zip
          retention-days: 90

  build-macos-release:
    name: Build macOS Release
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        lfs: true

    - name: Checkout LFS objects
      run: git lfs pull

    - name: Install dependencies
      run: |
        brew install sdl2 sdl2_mixer libpng libzip zlib

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        target: aarch64-apple-darwin
        cache: true
        cache-workspaces: astonia_net

    - name: Build release
      run: make macos

    - name: Strip debug symbols
      run: |
        strip bin/moac
        strip -x bin/libastonia_net.dylib

    - name: Create distribution package
      run: make distrib

    - name: Upload distribution
      uses: actions/upload-artifact@v4
      with:
        name: macos-release
        path: macos_client.tar.gz
        retention-days: 90

  build-appimage-release:
    name: Build AppImage Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        lfs: true

    - name: Checkout LFS objects
      run: git lfs pull

    - name: Build in Arch Linux container
      run: |
        docker run --rm \
          -v "$PWD:/workspace" \
          -w /workspace \
          archlinux:latest \
          /bin/bash -c '
            set -e
            
            # Update and install dependencies
            pacman -Syu --noconfirm
            pacman -S --noconfirm \
              base-devel \
              git \
              curl \
              wget \
              file \
              sdl3 \
              sdl2-compat \
              sdl2_mixer \
              libpng \
              libzip \
              zlib \
              patchelf \
              desktop-file-utils
            
            # Install Rust
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            source "$HOME/.cargo/env"
            
            # Build the application
            make linux
            
            # Strip debug symbols
            strip bin/moac
            strip bin/libastonia_net.so
            strip bin/amod.so
            
            echo "Build complete"
          '

    - name: Download linuxdeploy tools
      run: |
        wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        chmod +x linuxdeploy-x86_64.AppImage

    - name: Create AppDir structure
      run: |
        mkdir -p AppDir/usr/bin
        mkdir -p AppDir/usr/lib
        mkdir -p AppDir/usr/share/applications
        mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
        mkdir -p AppDir/usr/share/astonia
        
        # Copy binaries
        cp bin/moac AppDir/usr/bin/
        cp bin/libastonia_net.so AppDir/usr/lib/
        cp bin/amod.so AppDir/usr/lib/
        
        # Copy resources
        cp -r res AppDir/usr/share/astonia/
        
        # Create a wrapper script that sets up the environment
        cat > AppDir/usr/bin/moac-wrapper << 'EOF'
        #!/bin/bash
        # Get the AppImage's AppDir location
        APPDIR="${APPDIR:-$(cd "$(dirname "$0")/../.." && pwd)}"
        
        # Set library path
        export LD_LIBRARY_PATH="$APPDIR/usr/lib:${LD_LIBRARY_PATH}"
        
        # Change to the resource directory
        cd "$APPDIR/usr/share/astonia" || exit 1
        
        # Execute the actual binary
        exec "$APPDIR/usr/bin/moac" "$@"
        EOF
        chmod +x AppDir/usr/bin/moac-wrapper
        
        # Create desktop file (pointing to wrapper)
        cat > AppDir/astonia.desktop << 'EOF'
        [Desktop Entry]
        Type=Application
        Name=Astonia Community Client
        Comment=Community-maintained client for Astonia 3
        Exec=moac-wrapper
        Icon=astonia
        Categories=Game;
        Terminal=false
        EOF
        
        # Convert .ico to .png for better compatibility
        # If ImageMagick is available, convert; otherwise use as-is
        if command -v convert &> /dev/null; then
          convert res/moa3.ico[0] AppDir/astonia.png || cp res/moa3.ico AppDir/astonia.png
        else
          cp res/moa3.ico AppDir/astonia.png
        fi

    - name: Create AppImage
      run: |
        # Run in the same Arch container to ensure we bundle libraries
        docker run --rm \
          -v "$PWD:/workspace" \
          -w /workspace \
          archlinux:latest \
          /bin/bash -c '
            set -e
            
            # Install dependencies
            pacman -Syu --noconfirm
            pacman -S --noconfirm \
              sdl3 \
              sdl2-compat \
              sdl2_mixer \
              libpng \
              libzip \
              zlib \
              patchelf \
              file \
              fuse2 \
              imagemagick
            
            # Make linuxdeploy executable
            chmod +x linuxdeploy-x86_64.AppImage
            
            # Extract linuxdeploy (since FUSE might not work in container)
            ./linuxdeploy-x86_64.AppImage --appimage-extract
            
            # Bundle the application with all dependencies
            OUTPUT=astonia-client \
            ARCH=x86_64 \
            ./squashfs-root/AppRun \
              --appdir=AppDir \
              --executable=AppDir/usr/bin/moac-wrapper \
              --desktop-file=AppDir/astonia.desktop \
              --icon-file=AppDir/astonia.png \
              --library=/usr/lib/libSDL3.so.0 \
              --library=/usr/lib/libSDL2-2.0.so.0 \
              --library=/usr/lib/libSDL2_mixer-2.0.so.0 \
              --output appimage
            
            echo "AppImage created successfully"
            ls -lh *.AppImage
          '

    - name: Upload AppImage
      uses: actions/upload-artifact@v4
      with:
        name: appimage-release
        path: astonia-client.AppImage
        retention-days: 90

  create-release:
    name: Create GitHub Release
    needs: [build-linux-release, build-windows-release, build-macos-release, build-appimage-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        lfs: true

    - name: Checkout LFS objects
      run: git lfs pull

    - name: Create source tarball with LFS objects
      run: |
        # Create a source archive that includes LFS files
        TAG_NAME="${GITHUB_REF_NAME}"
        git archive --format=tar --prefix="astonia_community_client-${TAG_NAME}/" HEAD | tar -x
        
        # Copy LFS files into the extracted archive
        find res -type f | while read file; do
          mkdir -p "astonia_community_client-${TAG_NAME}/$(dirname "$file")"
          cp "$file" "astonia_community_client-${TAG_NAME}/$file"
        done
        
        # Create the final tarball
        tar czf source-with-lfs.tar.gz "astonia_community_client-${TAG_NAME}/"
        rm -rf "astonia_community_client-${TAG_NAME}/"

    - name: Download Linux release
      uses: actions/download-artifact@v4
      with:
        name: linux-release

    - name: Download Windows release
      uses: actions/download-artifact@v4
      with:
        name: windows-release

    - name: Download macOS release
      uses: actions/download-artifact@v4
      with:
        name: macos-release

    - name: Download AppImage release
      uses: actions/download-artifact@v4
      with:
        name: appimage-release

    - name: Extract version and compute SHA256
      id: vars
      run: |
        # Extract tag name (e.g., v1.0.0 or 1.0.0)
        TAG_NAME="${GITHUB_REF_NAME}"
        echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
        
        # Strip leading 'v' if present and sanitize for pkgver
        # pkgver cannot contain hyphens, only alphanumeric and periods
        PKGVER="${TAG_NAME#v}"
        PKGVER="${PKGVER//-/.}"  # Replace hyphens with periods
        echo "pkgver=${PKGVER}" >> $GITHUB_OUTPUT
        
        # Compute SHA256 of the source tarball (for PKGBUILD)
        SHA256=$(sha256sum source-with-lfs.tar.gz | awk '{print $1}')
        echo "sha256=${SHA256}" >> $GITHUB_OUTPUT
        
        echo "Version: ${PKGVER}"
        echo "SHA256: ${SHA256}"

    - name: Generate PKGBUILD
      run: |
        # Copy the pkgbuild template directory
        cp -r build/pkgbuild astonia-client-pkgbuild
        
        # Generate the final PKGBUILD from template
        sed \
          -e "s|@PKGVER@|${{ steps.vars.outputs.pkgver }}|g" \
          -e "s|@TAG@|${{ steps.vars.outputs.tag_name }}|g" \
          -e "s|@GITHUB_REPO@|${{ github.repository }}|g" \
          -e "s|@SHA256@|${{ steps.vars.outputs.sha256 }}|g" \
          astonia-client-pkgbuild/PKGBUILD.in > astonia-client-pkgbuild/PKGBUILD
        rm astonia-client-pkgbuild/PKGBUILD.in
        
        echo "Generated PKGBUILD:"
        cat astonia-client-pkgbuild/PKGBUILD
        
        # Create a tarball of the pkgbuild directory
        tar czf pkgbuild.tar.gz astonia-client-pkgbuild/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          source-with-lfs.tar.gz
          linux_client.tar.gz
          windows_client.zip
          macos_client.tar.gz
          astonia-client.AppImage
          pkgbuild.tar.gz
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sdl3-linux:
    name: Build SDL3 for Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build SDL3 + SDL3_mixer (cached)
        uses: ./.github/actions/setup-sdl3-linux
        with:
          build-on-miss: 'true'

  build-shaders-release:
    needs: [build-sdl3-linux]
    name: Compile Shaders
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Compiled shaders only change when the GLSL sources or the toolchain do.
      # Keying the cache on both means the expensive SDL_shadercross/DXC build
      # runs once and virtually every later build restores the outputs and skips
      # the toolchain entirely.
      - name: Restore compiled shaders
        id: cache-shaders
        uses: actions/cache@v4
        with:
          path: res/shaders/compiled
          key: shaders-${{ hashFiles('res/shaders/*.vert', 'res/shaders/*.frag', 'build/make/Makefile.shaders', '.github/actions/setup-shader-toolchain/action.yml') }}

      # shadercross links against SDL3
      - name: Setup SDL3 (cached)
        if: steps.cache-shaders.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-sdl3-linux

      - name: Setup shader toolchain
        if: steps.cache-shaders.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-shader-toolchain

      - name: Compile all shader formats
        if: steps.cache-shaders.outputs.cache-hit != 'true'
        run: make -f build/make/Makefile.shaders all

      # Runs on cache hits too, so a truncated or partial cache entry is caught
      # rather than shipped.
      - name: Verify every shader built for every backend
        run: |
          missing=0
          # Derived from the sources, never hardcoded: a hand-maintained list
          # silently skipped two pairs (glow, prim_batch) for several releases.
          names=$(ls res/shaders/*.vert | xargs -n1 basename | sed 's/\.vert$//')
          [ -n "$names" ] || { echo "ERROR: no shader sources in res/shaders/"; exit 1; }
          echo "Verifying shader pairs: $names"
          for n in $names; do
            for s in vs ps; do
              for e in spv dxil msl; do
                f="res/shaders/compiled/${n}_${s}.${e}"
                [ -s "$f" ] || { echo "MISSING: $f"; missing=1; }
              done
            done
          done
          ls -la res/shaders/compiled/
          [ "$missing" = "0" ] || { echo "ERROR: shader set incomplete"; exit 1; }

      - name: Upload compiled shaders
        uses: actions/upload-artifact@v7
        with:
          name: compiled-shaders
          path: res/shaders/compiled/
          retention-days: 7
          overwrite: true
  build-linux-release:
    needs: [build-sdl3-linux]
    name: Build Linux Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup SDL3 (cached)
        uses: ./.github/actions/setup-sdl3-linux

      - name: Install LLVM toolchain
        uses: ./.github/actions/setup-llvm-toolchain
        with:
          llvm-version: "21"
          packages: clang-21
          create-alternatives: "true"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libpng-dev \
            libzip-dev \
            zlib1g-dev \
            libmimalloc-dev \
            libluajit-5.1-dev

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: astonia_net

      - name: Build release
        run: make linux

      - name: Strip debug symbols
        run: |
          strip bin/moac
          strip bin/libastonia_net.so

      - name: Prepare distribution staging
        run: make distrib-stage

      - name: Upload Binaries (Linux)
        uses: actions/upload-artifact@v7
        with:
          name: linux-binaries
          path: distrib/linux_client/bin/
          retention-days: 7
          overwrite: true

  build-windows-release:
    name: Build Windows Release
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Checkout LFS objects
        shell: bash
        run: git lfs pull

      - name: Install Rust toolchain (LLVM variant)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable-x86_64-pc-windows-gnullvm
          cache: true
          cache-workspaces: astonia_net

      - name: Setup MSYS2 (clang64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: clang64
          path-type: inherit
          update: true
          install: >
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-sdl3-mixer
            mingw-w64-clang-x86_64-sdl3-ttf
            mingw-w64-clang-x86_64-libpng
            mingw-w64-clang-x86_64-libzip
            mingw-w64-clang-x86_64-dwarfstack
            mingw-w64-clang-x86_64-mimalloc
            mingw-w64-clang-x86_64-luajit
            make
            git

      - name: Build release
        run: make windows

      - name: Copy DLL to bin
        run: cp astonia_net/target/x86_64-pc-windows-gnullvm/release/astonia_net.dll bin/

      - name: Strip debug symbols
        run: |
          strip bin/moac.exe
          strip bin/astonia_net.dll

      - name: Prepare distribution staging
        run: make distrib-stage

      - name: Upload Binaries (Windows)
        uses: actions/upload-artifact@v7
        with:
          name: windows-binaries
          path: distrib/windows_client/bin/
          retention-days: 7
          overwrite: true

      - name: Upload Mod SDK (Windows)
        uses: actions/upload-artifact@v7
        with:
          name: mod-sdk-windows
          path: |
            lib/moac.a
            lib/moac.lib
            src/amod/amod.h
            src/amod/amod_structs.h
            src/dll.h
            src/astonia.h
          retention-days: 7
          if-no-files-found: error

  build-macos-release:
    name: Build MacOS Release
    runs-on: macos-latest
    timeout-minutes: 30

    env:
      # Identifier the signatures are issued against. Overridable so a fork can sign
      # under its own namespace without patching every step below.
      MACOS_BUNDLE_ID: com.ugaris.client
      ENTITLEMENTS: build/macos/entitlements.plist
      # Must NOT be named RCODESIGN_*: rcodesign registers every RCODESIGN_
      # environment variable as a configuration source, so RCODESIGN_VERSION
      # is read as a config key "version" and every invocation fails with
      # UnknownField("version"). This only pins the download URL.
      CODESIGN_TOOL_VERSION: "0.29.0"

    steps:
      # Signing is optional: without APPLE_CERT_P12 every signing step below is
      # skipped and the job still produces (unsigned) binaries, exactly as before
      # the Apple credentials existed.
      - name: Check signing availability
        id: signing
        run: |
          if [ -n "$CERT" ]; then echo "available=true"; else echo "available=false"; fi >> $GITHUB_OUTPUT
        env:
          CERT: ${{ secrets.APPLE_CERT_P12 }}

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install dependencies
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install sdl3 sdl3_mixer sdl3_ttf libzip zlib mimalloc imagemagick

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-darwin
          cache: true
          cache-workspaces: astonia_net

      - name: Build release (moac + Rust lib)
        run: make macos

      - name: Strip debug symbols
        run: |
          strip bin/moac
          strip -x bin/libastonia_net.dylib

      # ---- signing toolchain + credentials (skipped when secrets are absent) ----
      - name: Install rcodesign
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o rcodesign.tar.gz \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${CODESIGN_TOOL_VERSION}/apple-codesign-${CODESIGN_TOOL_VERSION}-macos-universal.tar.gz"
          mkdir -p rcodesign-dist && tar xzf rcodesign.tar.gz -C rcodesign-dist
          BIN="$(find rcodesign-dist -name rcodesign -type f -print -quit)"
          [ -n "$BIN" ] || { echo "ERROR: rcodesign missing from the release archive"; exit 1; }
          mkdir -p "$HOME/.local/bin"
          mv "$BIN" "$HOME/.local/bin/rcodesign"
          chmod +x "$HOME/.local/bin/rcodesign"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rm -rf rcodesign.tar.gz rcodesign-dist

      - name: Install signing credentials
        if: steps.signing.outputs.available == 'true'
        env:
          P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p certs private_keys
          echo "${{ secrets.APPLE_CERT_P12 }}" | base64 --decode > certs/dist.p12
          printf '%s' '${{ secrets.APP_STORE_CONNECT_KEY }}' > private_keys/AuthKey.p8
          rcodesign encode-app-store-connect-api-key \
            -o private_keys/appstore_key.json \
            '${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}' \
            '${{ secrets.APP_STORE_CONNECT_KEY_ID }}' \
            private_keys/AuthKey.p8

          # Catch the likely setup mistake - an "Apple Development" or "Apple
          # Distribution" certificate exported instead of a "Developer ID
          # Application" one - before Apple rejects it minutes later during
          # notarization. The matched line names the signing identity, which is
          # worth having in the log.
          # Capture first, then match: piping rcodesign into grep lets grep close
          # the pipe on a match, which kills rcodesign and - under pipefail - makes
          # the guard reject exactly the certificates it should accept.
          CERT_INFO="$(rcodesign analyze-certificate --p12-file certs/dist.p12 \
            --p12-password "$P12_PASSWORD")"
          if ! printf '%s\n' "$CERT_INFO" | grep -i "developer id"; then
            echo "ERROR: APPLE_CERT_P12 is not a Developer ID Application certificate - see macos/README.md in Ugaris_Distribution"
            exit 1
          fi

      - name: Collect Binaries (macOS)
        run: |
          mkdir -p binaries
          cp bin/moac binaries/
          cp bin/libastonia_net.dylib binaries/
          cp -L /opt/homebrew/lib/libSDL3.0.dylib binaries/ 2>/dev/null || true
          cp -L /opt/homebrew/lib/libSDL3_mixer.0.dylib binaries/ 2>/dev/null || true
          cp -L /opt/homebrew/lib/libSDL3_ttf.0.dylib binaries/ 2>/dev/null || true
          echo "=== macOS Binaries ==="
          ls -la binaries/

      # These loose binaries - not the .app or the DMG - are what the Steam macOS
      # depot ships, so they are the ones that have to carry a signature. Apple
      # Silicon refuses to execute an unsigned Mach-O outright.
      - name: Sign loose binaries
        if: steps.signing.outputs.available == 'true'
        env:
          P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          # Dependencies first, executable last: a Mach-O's signature covers the
          # libraries it links against by hash.
          for lib in binaries/*.dylib; do
            [ -e "$lib" ] || continue
            echo "--- signing $lib"
            rcodesign sign \
              --p12-file certs/dist.p12 --p12-password "$P12_PASSWORD" \
              --binary-identifier "${MACOS_BUNDLE_ID}.$(basename "$lib" | sed 's/\.dylib$//' | tr '_' '-')" \
              --for-notarization \
              "$lib"
          done
          echo "--- signing binaries/moac"
          rcodesign sign \
            --p12-file certs/dist.p12 --p12-password "$P12_PASSWORD" \
            --binary-identifier "${MACOS_BUNDLE_ID}" \
            --entitlements-xml-file "${ENTITLEMENTS}" \
            --for-notarization \
            binaries/moac
          # Informational only - rcodesign's own `verify` warns that it is
          # unreliable. The authoritative check happens when Ugaris_Distribution
          # submits the assembled depot for notarization.
          echo "=== signing identifiers ==="
          for f in binaries/moac binaries/*.dylib; do
            [ -e "$f" ] || continue
            INFO="$(rcodesign print-signature-info "$f" 2>/dev/null || true)"
            ID="$(printf '%s\n' "$INFO" | grep -m1 -E '^ +identifier:' | sed 's/.*identifier: *//')" || true
            printf '  %-40s %s\n' "$(basename "$f")" "${ID:-NO SIGNATURE}"
          done

      - name: Upload Binaries (macOS)
        uses: actions/upload-artifact@v7
        with:
          name: macos-binaries
          path: binaries/
          retention-days: 7

      # ---- .app bundle + DMG for distribution outside Steam ----
      - name: Build .app bundle
        if: steps.signing.outputs.available == 'true'
        run: BUNDLE_ID="${MACOS_BUNDLE_ID}" make macos-appbundle

      - name: Sign Astonia.app
        if: steps.signing.outputs.available == 'true'
        env:
          P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          mv distrib/Astonia.app distrib/Astonia-unsigned.app
          rcodesign sign \
            --p12-file certs/dist.p12 --p12-password "$P12_PASSWORD" \
            --binary-identifier "${MACOS_BUNDLE_ID}" \
            --entitlements-xml-file "${ENTITLEMENTS}" \
            --for-notarization \
            distrib/Astonia-unsigned.app distrib/Astonia.app
          rm -rf distrib/Astonia-unsigned.app

      - name: Create DMG from signed app
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          cd distrib
          hdiutil create \
            -volname "Astonia" \
            -srcfolder "Astonia.app" \
            -ov \
            -format UDZO \
            "Astonia-macOS-unsigned.dmg"
          cd ..
          ls -lh distrib/Astonia-macOS-unsigned.dmg

      - name: Sign, notarize, and staple DMG
        if: steps.signing.outputs.available == 'true'
        env:
          P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          rcodesign sign \
            --p12-file certs/dist.p12 --p12-password "$P12_PASSWORD" \
            --for-notarization \
            distrib/Astonia-macOS-unsigned.dmg distrib/Astonia-macOS.dmg
          rcodesign notary-submit \
            --api-key-file private_keys/appstore_key.json \
            --wait --max-wait-seconds 1800 --staple \
            distrib/Astonia-macOS.dmg
          rm -f distrib/Astonia-macOS-unsigned.dmg
          ls -lh distrib/Astonia-macOS.dmg

      - name: Discard signing credentials
        if: always()
        run: rm -rf certs private_keys

      - name: Upload signed DMG
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: distrib/Astonia-macOS.dmg
          retention-days: 7
          if-no-files-found: error

  build-appimage-release:
    name: Build AppImage Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Build AppImage
        run: make appimage

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: appimage-release
          path: astonia-client.AppImage
          retention-days: 7

  create-release:
    name: Create GitHub Release
    needs:
      [
        build-linux-release,
        build-windows-release,
        build-macos-release,
        build-appimage-release,
        build-shaders-release,
      ]
    # macOS is not shipped yet: a failed macOS build must not block the Linux/Windows release
    if: >-
      ${{ !cancelled()
          && needs.build-linux-release.result == 'success'
          && needs.build-windows-release.result == 'success'
          && needs.build-appimage-release.result == 'success'
          && needs.build-shaders-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Download Linux Binaries
        uses: actions/download-artifact@v8
        with:
          name: linux-binaries
          path: linux_client/bin

      - name: Download Windows Binaries
        uses: actions/download-artifact@v8
        with:
          name: windows-binaries
          path: windows_client/bin

      - name: Download macOS DMG
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: macos-dmg
          path: .

      - name: Download AppImage
        uses: actions/download-artifact@v8
        with:
          name: appimage-release

      - name: Download Mod SDK (Windows)
        uses: actions/download-artifact@v8
        with:
          name: mod-sdk-windows
          path: mod-sdk

      - name: Download macOS Binaries
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: macos-binaries
          path: macos-binaries

      - name: Download compiled shaders
        uses: actions/download-artifact@v8
        with:
          name: compiled-shaders
          path: res/shaders/compiled

      - name: Rename DMG to match convention
        if: hashFiles('Astonia-macOS.dmg') != ''
        run: mv Astonia-macOS.dmg client-macos.dmg

      - name: Rename AppImage to match convention
        run: mv astonia-client.AppImage client-linux.AppImage

      - name: Assemble full distributions
        run: |
          cp -r res linux_client/res
          cp -r res windows_client/res
          cp eula.txt license.txt linux_client/ 2>/dev/null || true
          cp eula.txt create_shortcut.bat windows_client/ 2>/dev/null || true

      - name: Create distribution archives
        run: |
          tar czf client-linux.tar.gz linux_client
          zip -q -r client-windows.zip windows_client
          zip -q -r mod-sdk.zip mod-sdk
          tar czf client-linux-binaries.tar.gz -C linux_client/bin .
          # Steam consumes the binaries-only archives, which carry no res/.
          # Ship the compiled shaders separately so the content depot can place
          # them at res/shaders/compiled/ next to the other resources.
          tar czf client-shaders.tar.gz -C res/shaders/compiled .
          cd windows_client/bin && zip -q -r ../../client-windows-binaries.zip . && cd ../..
          if [ -d macos-binaries ] && [ -n "$(ls -A macos-binaries)" ]; then
            tar czf client-macos-binaries.tar.gz -C macos-binaries .
          else
            echo "No macOS binaries (build skipped/failed) - releasing Linux/Windows only"
          fi

      - name: Generate checksums
        run: |
          sha256sum client-linux.tar.gz > checksums.txt
          sha256sum client-windows.zip >> checksums.txt
          sha256sum client-linux.AppImage >> checksums.txt
          [ -f client-macos.dmg ] && sha256sum client-macos.dmg >> checksums.txt || true
          sha256sum mod-sdk.zip >> checksums.txt
          sha256sum client-linux-binaries.tar.gz >> checksums.txt
          sha256sum client-shaders.tar.gz >> checksums.txt
          sha256sum client-windows-binaries.zip >> checksums.txt
          [ -f client-macos-binaries.tar.gz ] && sha256sum client-macos-binaries.tar.gz >> checksums.txt || true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            client-linux.tar.gz
            client-windows.zip
            client-linux.AppImage
            client-macos.dmg
            mod-sdk.zip
            client-linux-binaries.tar.gz
            client-windows-binaries.zip
            client-shaders.tar.gz
            client-macos-binaries.tar.gz
            checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
